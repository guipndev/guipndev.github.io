<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Fênix 67 – Jogos de Futebol</title><meta name="color-scheme" content="dark">
<style>
:root{--bg:#050505;--card:#15100d;--tx:#fff2e6;--or:#ff6a1a;--ye:#ffb81c;--ok:#2ecc71;--no:#e74c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif;text-align:center}
header img{width:min(340px,80%);display:block;margin:0 auto}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;justify-content:safe center;position:sticky;top:0;background:#050505ee}
nav button,.b{background:linear-gradient(#ff6a1a,#c2380a);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
nav button.on{background:linear-gradient(#ffb81c,#ff6a1a);color:#200}
main{max-width:640px;margin:auto;padding:10px}
.c{background:var(--card);border:1px solid #5a2a10;border-radius:14px;padding:14px;margin:10px 0}
.badge{position:relative;display:inline-flex;width:50px;height:58px;border-radius:6px 6px 50% 50%/6px 6px 65% 65%;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid #fff8}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.o{background:#241912;color:var(--tx);border:1px solid #7a3a18;border-radius:10px;padding:12px;font-size:15px;cursor:pointer}
.ok{background:var(--ok)!important;color:#000}.no{background:var(--no)!important}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;background:#241912;border:1px solid #7a3a18;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;flex-direction:column}
.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0a2a0a;padding:8px;border:3px solid #fff;border-bottom:0;border-radius:8px 8px 0 0;margin:10px 0}
.z{height:64px;background:#ffffff14;border:1px dashed #fff6;border-radius:6px;font-size:28px;color:#fff;cursor:pointer}
select{background:#241912;color:var(--tx);border:1px solid #7a3a18;border-radius:8px;padding:8px;font-size:15px}
.sm{font-size:13px;opacity:.7}.gold{border-color:#ffd54a!important;box-shadow:0 0 25px #ffb81c99,inset 0 0 20px #ffd54a44;animation:gl 1.2s ease-in-out infinite alternate}@keyframes gl{from{box-shadow:0 0 12px #ffb81c66}to{box-shadow:0 0 34px #ffd54a}}.fx{position:fixed;inset:0;z-index:99;pointer-events:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#ffd54acc 0,#ffb81c55 35%,transparent 70%);animation:fxo 2s forwards}.fx b{font-size:30px;text-align:center;color:#fff;text-shadow:0 0 12px #ffb81c,0 0 28px #ff9800;animation:fxp .5s ease-out}.sp{position:absolute;color:#ffd54a;animation:spk 1.6s ease-out forwards}@keyframes fxo{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}@keyframes fxp{from{transform:scale(.3)}to{transform:scale(1)}}@keyframes spk{from{transform:translateY(0) scale(.4);opacity:1}to{transform:translateY(-120px) scale(1.4);opacity:0}}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid #7a3a18;border-radius:14px;padding:16px 8px;color:var(--tx);cursor:pointer;text-align:center}.card:active{background:#2a1a10}.pitch{background:repeating-linear-gradient(#1d6b2f 0 40px,#1a5f2a 40px 80px);border:3px solid #fff;border-radius:10px;padding:10px 2px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}.row{display:flex;justify-content:space-around}.pl{width:64px;font-size:11px;line-height:1.2;color:#fff}.pl svg{display:block;margin:auto}.pn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#000a;border-radius:4px;padding:1px 2px}.em{width:46px;height:46px;border:2px dashed #fff8;border-radius:50%;margin:5px auto;display:flex;align-items:center;justify-content:center;color:#fff8;font-size:12px}ul{list-style:none;padding:0;text-align:left}li{padding:6px 0;border-bottom:1px solid #3a2012}
</style></head><body>
